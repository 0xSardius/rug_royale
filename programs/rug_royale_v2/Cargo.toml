[package]
name = "rug_royale_v2"
version = "0.1.0"
description = "Rug Royale v2: 1v1 paper-trading duels on live prices (MagicBlock ER)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "rug_royale_v2"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
